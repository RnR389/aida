<title>Website-Audit – Entwurf</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
:root{--paper:#F5F0E6;--card:#FCFAF5;--ink:#18211F;--ink-3:#6B7572;--teal:#1F6B76;--teal-2:#15515A;--sun:#E9A21F;--clay:#B35A3C}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 1.15rem/1.55 'Alegreya Sans','Trebuchet MS',sans-serif;display:grid;place-items:center;padding:24px;-webkit-font-smoothing:antialiased}
.box{width:min(440px,100%);background:var(--card);border-radius:28px;padding:44px 38px;box-shadow:0 2px 4px rgba(24,33,31,.04),0 40px 80px -30px rgba(24,33,31,.35);text-align:center}
.daisy{width:64px;margin:0 auto 22px;display:block}
h1{font:700 2rem/1.1 'Alegreya',Georgia,serif;letter-spacing:-.02em;margin:0 0 10px}
p{color:var(--ink-3);margin:0 0 26px}
input{width:100%;font:inherit;font-size:1.1rem;padding:15px 18px;border:1px solid rgba(24,33,31,.22);border-radius:14px;background:#fff;color:var(--ink);text-align:center}
input:focus{outline:0;border-color:var(--teal);box-shadow:0 0 0 4px rgba(31,107,118,.14)}
button{width:100%;margin-top:12px;font:700 1.1rem/1 'Alegreya Sans',sans-serif;padding:18px;border:0;border-radius:999px;background:var(--teal);color:#fff;cursor:pointer;box-shadow:0 10px 24px -12px rgba(21,81,90,.7)}
button:hover{background:var(--teal-2)}
button[disabled]{opacity:.7;cursor:wait}
.err{color:var(--clay);font-size:1rem;min-height:1.5em;margin:14px 0 0}
</style>
</head>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const KEY_NAME = 'aida-entwurf-key';
async function decrypt(raw){
  const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(P.i)}, key, b64(P.d));
  return new TextDecoder().decode(plain);
}
function show(html){ document.open(); document.write(html); document.close(); }
async function open_(raw){ show(await decrypt(raw)); }
async function derive(pw){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2', hash:'SHA-256', salt:b64(P.s), iterations:P.n}, base, 256));
}
(async () => {
  try { const k = sessionStorage.getItem(KEY_NAME); if (k) await open_(b64(k)); } catch(_) { try{sessionStorage.removeItem(KEY_NAME)}catch(_){} }
})();
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('b'), err = document.getElementById('e');
  btn.disabled = true; btn.textContent = 'Wird geöffnet …'; err.textContent = '';
  try {
    const raw = await derive(document.getElementById('pw').value);
    const html = await decrypt(raw);
    try { sessionStorage.setItem(KEY_NAME, btoa(String.fromCharCode(...raw))); } catch(_) {}
    show(html);
  } catch(_) {
    err.textContent = 'Das Passwort stimmt nicht.';
    btn.disabled = false; btn.textContent = 'Öffnen';
  }
});
</script>
